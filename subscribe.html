        <button class="navbar-toggler" type="button"

<!-- Subscribe Section -->
<section class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-7 col-lg-6">

            <div class="card shadow-sm">

                <div class="card-body p-4 text-center">

                    <h1 class="text-primary mb-3">
                        Subscribe to G Wave Tech
                    </h1>

                    <p class="text-muted">
                        Stay updated with our latest technology
                        articles, tutorials and digital innovations.
                    </p>

                    <form id="subscribeForm">

                        <div class="mb-3 text-start">

                            <label for="subscriberName"
                                   class="form-label">
                                Full Name
                            </label>

                            <input type="text"
                                   class="form-control"
                                   id="subscriberName"
                                   placeholder="Enter your full name"
                                   required>

                        </div>


                        <div class="mb-3 text-start">

                            <label for="subscriberEmail"
                                   class="form-label">
                                Email Address
                            </label>

                            <input type="email"
                                   class="form-control"
                                   id="subscriberEmail"
                                   placeholder="Enter your email address"
                                   required>

                        </div>


                        <button type="submit"
                                class="btn btn-primary w-100">
                            Subscribe Now
                        </button>

                    </form>

                    <p class="small text-muted mt-3">
                        By subscribing, you agree to receive
                        updates from G Wave Tech.
                    </p>

                </div>

            </div>

        </div>

    </div>

</section>
