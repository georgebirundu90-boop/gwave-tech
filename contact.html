<!-- Contact Section -->
<section class="container py-5">

    <div class="text-center mb-4">
        <h1 class="text-primary">Contact Us</h1>

        <p class="lead">
            Have a question or suggestion?
            We'd love to hear from you.
        </p>
    </div>

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow-sm">

                <div class="card-body p-4">

                    
<form id="contactForm" action="process_contact.php" method="POST">

    <!-- Full Name -->
    <div class="mb-3">
        <label for="name" class="form-label">
            Full Name
        </label>

        <input type="text" class="form-control"
               id="name" name="full_name"
               placeholder="Enter your name" required>
    </div>

    <!-- Email -->
    <div class="mb-3">
        <label for="email" class="form-label">
            Email Address
        </label>

        <input type="email" class="form-control"
               id="email" name="email"
               placeholder="Enter your email" required>
    </div>

    <!-- Subject -->
    <div class="mb-3">
        <label for="subject" class="form-label">
            Subject
        </label>

        <input type="text" class="form-control"
               id="subject" name="subject"
               placeholder="Enter subject" required>
    </div>

    <!-- Message -->
    <div class="mb-3">
        <label for="message" class="form-label">
            Message
        </label>

        <textarea class="form-control"
                  id="message" name="message"
                  rows="5"
                  placeholder="Write your message here"
                  required></textarea>
    </div>

    <button type="submit" class="btn btn-primary w-100">
        Send Message
    </button>

</form>


                </div>

            </div>

        </div>

    </div>

</section>

<!-- Google Map Section: Displays the location of Nairobi, Kenya -->
<section class="container py-5">

    <!-- Heading and description displayed above the map -->
    <div class="text-center mb-4">

        <!-- Main heading for the map section -->
        <h2>Find Us in Nairobi</h2>

        <!-- Short description to guide website visitors -->
        <p>Explore our location on Google Maps.</p>

    </div>

    <!-- Map container: Holds the embedded Google Map -->
    <div class="map-container">

        <!-- iframe allows us to display an external webpage inside ours -->
        <iframe

            <!-- Google Maps embed link showing Nairobi, Kenya -->
            src="https://maps.google.com/maps?q=Nairobi%2C%20Kenya&t=&z=12&ie=UTF8&iwloc=&output=embed"

            <!-- Makes the map occupy the full width of its container -->
            width="100%"

            <!-- Sets the height of the displayed map -->
            height="400"

            <!-- Removes the default iframe border -->
            style="border:0;"

            <!-- Allows visitors to view the map in full screen -->
            allowfullscreen=""

            <!-- Loads the map when it is needed, improving page loading -->
            loading="lazy"

            <!-- Controls the referrer information sent to Google -->
            referrerpolicy="no-referrer-when-downgrade">

        </iframe>

    </div>

</section>
